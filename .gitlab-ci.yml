workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - tagChecking
  - lint
  - build
  - test
  - coverage-report
  - sonarqube
  - deploy

# Check that the tag matches the expected 'sprintX.Y' format
tag-checker:
  stage: tagChecking
  script:
    - python3 ./runner-scripts/tag_checker.py $CI_COMMIT_TAG
  only:
    - tags

# Runs prettier on Tailwind CSS classes to ensure consistent structure
prettier-check:
  stage: lint
  when: always
  script:
    - cd Grinder.App
    - npm ci
    - npx prettier --check .

# builds dotnet project for all branches, except dev and main
# regular builds should not be saved (no artifacts)
dotnet-build:
  stage: build
  when: always
  script:
    - cd Grinder.Api
    - dotnet build

# builds svelte project for all branches, except dev and main
# regular builds should not be saved (no artifacts)
svelte-build:
  stage: build
  when: always
  script:
    - cd Grinder.App
    - npm ci
    - npm run build

.test_template:
  stage: test
  artifacts:
    when: always
    paths:
      # Collect individual results for each namespace
      - Grinder.Api.Tests/coverage-results/*/
    expire_in: 1 day

  before_script: # kill any zombie testhost processes that have been running for more than 15 minutes (900 seconds)
    - |
      ps -eo pid,etimes,cmd | grep -E "testhost\.dll|vstest\.console\.dll" | grep -v grep | while read -r pid etimes _; do
          if [ "$etimes" -gt 900 ]; then
              echo "Reaping stale test process $pid (running ${etimes}s)"
              kill -9 "$pid" 2>/dev/null || true
          fi
      done || true
  script:
    - |
      set -uo pipefail
      trap 'pkill -9 -f "testhost.*${CI_PROJECT_DIR}" || true' EXIT
      timeout --kill-after=30s 20m dotnet test Grinder.Api.Tests/Grinder.Api.Tests.csproj --filter "FullyQualifiedName~$TEST_NAMESPACE" --collect:'XPlat Code Coverage' --results-directory Grinder.Api.Tests/coverage-results/$TEST_NAMESPACE -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Grinder.Api/**/*
        - Grinder.Api.Test/**/*
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - Grinder.Api/**/*
        - Grinder.Api.Test/**/*

unit-tests:
  extends: .test_template
  variables:
    TEST_NAMESPACE: Unit

integration-tests:
  extends: .test_template
  variables:
    TEST_NAMESPACE: Integration

acceptance-tests:
  extends: .test_template
  variables:
    TEST_NAMESPACE: Acceptance

sonarqube-report:
  stage: sonarqube
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet tool install --global dotnet-sonarscanner
    - export PATH="$PATH:/root/.dotnet/tools"

    # begin analysis on reports from test jobs
    - dotnet sonarscanner begin /k:"$SONAR_PROJECT_KEY" /d:sonar.host.url="https://sonarqube.csse.canterbury.ac.nz" /d:sonar.token="$SONARQUBE_TOKEN" /d:sonar.cs.opencover.reportsPaths="Grinder.Api.Tests/coverage-results/**/coverage.opencover.xml"

    # build is required for SonarScanner to analyse compiled output
    - dotnet build Grinder.Api/Grinder.Api.csproj -c Release

    # end analysis, upload results to SonarQube
    - dotnet sonarscanner end /d:sonar.token="$SONARQUBE_TOKEN"

  dependencies:
    - unit-tests
    - integration-tests
    - acceptance-tests

  only:
    - main

coverage-reporting:
  stage: coverage-report
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - apt-get update && apt-get install -y bc
    - dotnet tool install -g dotnet-reportgenerator-globaltool
    - export PATH="$PATH:$HOME/.dotnet/tools"

    # Generate full individual HTML + Cobertura reports for each type
    - 'reportgenerator -reports:"Grinder.Api.Tests/coverage-results/Unit/**/coverage.opencover.xml" -targetdir:"coverage-report/unit" -reporttypes:"Html;Cobertura"'
    - 'reportgenerator -reports:"Grinder.Api.Tests/coverage-results/Integration/**/coverage.opencover.xml" -targetdir:"coverage-report/integration" -reporttypes:"Html;Cobertura"'
    - 'reportgenerator -reports:"Grinder.Api.Tests/coverage-results/Acceptance/**/coverage.opencover.xml" -targetdir:"coverage-report/acceptance" -reporttypes:"Html;Cobertura"'

    # Generate the combined total report
    - 'reportgenerator -reports:"Grinder.Api.Tests/coverage-results/**/coverage.opencover.xml" -targetdir:"coverage-report/combined" -reporttypes:"Html;Cobertura"'

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Grinder.Api/**/*
        - Grinder.Api.Test/**/*
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - Grinder.Api/**/*
        - Grinder.Api.Test/**/*

  coverage: '/Total Coverage: \d+\.\d+%/'
  artifacts:
    paths:
      - coverage-report/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-report/combined/Cobertura.xml
  dependencies:
    - unit-tests
    - integration-tests
    - acceptance-tests

# During the DevOps workshop in sprint 2 we will cover the deployment configuration below
deploy-staging:
  stage: deploy
  script:
    # Build backend api and restart the underlying service
    - dotnet publish Grinder.Api/Grinder.Api.csproj -c Release -r linux-x64 --self-contained false /p:PublishSingleFile=true
    - mkdir -p /home/gitlab-runner/staging-uploads/
    - if [ -d /home/gitlab-runner/staging/wwwroot/uploads ] && [ ! -L /home/gitlab-runner/staging/wwwroot/uploads ]; then
      cp -rn /home/gitlab-runner/staging/wwwroot/uploads/. /home/gitlab-runner/staging-uploads/;
      fi
    - rm -rf /home/gitlab-runner/staging/ || true
    - mkdir -p /home/gitlab-runner/staging/
    - cp -r ./Grinder.Api/bin/Release/net10.0/linux-x64/publish/* /home/gitlab-runner/staging/

    - rm -rf /home/gitlab-runner/staging/wwwroot/uploads
    - mkdir -p /home/gitlab-runner/staging/wwwroot
    - ln -s /home/gitlab-runner/staging-uploads/ /home/gitlab-runner/staging/wwwroot/uploads

    - cp runner-scripts/staging.sh /home/gitlab-runner/staging.sh
    - chmod u+x /home/gitlab-runner/staging.sh
    - echo "export DB_HOST=${DB_HOST}" > /home/gitlab-runner/staging/.env
    - echo "export DB_NAME=${TEST_DB_NAME}" >> /home/gitlab-runner/staging/.env
    - echo "export DB_USER=${DB_USER}" >> /home/gitlab-runner/staging/.env
    - echo "export DB_PASS=${DB_PASS}" >> /home/gitlab-runner/staging/.env
    - echo "export EMAILSETTINGS__USERNAME=${EmailSettings__Username}" >> /home/gitlab-runner/staging/.env
    - echo "export EMAILSETTINGS__PASSWORD=${EmailSettings__Password}" >> /home/gitlab-runner/staging/.env
    - echo "export LIVEKIT_URL=${LIVEKIT_URL}" >> /home/gitlab-runner/staging/.env
    - echo "export LIVEKIT_API_KEY=${LIVEKIT_API_KEY}" >> /home/gitlab-runner/staging/.env 
    - echo "export LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}" >> /home/gitlab-runner/staging/.env
    - sudo systemctl restart staging

    # Build and deploy frontend
    - cd ./Grinder.App
    - npm ci
    - NODE_ENV=test npm run build
    - rm -rf /home/gitlab-runner/staging-frontend/ || true
    - mkdir -p /home/gitlab-runner/staging-frontend/
    - cp -r ./build/* /home/gitlab-runner/staging-frontend/

    # Ensure the folder is owned by the group nginx belongs to
    - chgrp -R gitlab-runner /home/gitlab-runner/staging-frontend/
    # Give the group Read and Execute permissions
    - chmod -R 750 /home/gitlab-runner/staging-frontend/
  artifacts:
    paths:
      - Grinder.Api/bin/Release/net10.0/linux-x64/publish/
      - Grinder.App/build/
  only:
    - dev

deploy-production:
  stage: deploy
  script:
    # Build backend api and restart the underlying service
    - dotnet publish Grinder.Api/Grinder.Api.csproj -c Release -r linux-x64 --self-contained false /p:PublishSingleFile=true
    - mkdir -p /home/gitlab-runner/production-uploads/
    - if [ -d /home/gitlab-runner/production/wwwroot/uploads ] && [ ! -L /home/gitlab-runner/production/wwwroot/uploads ]; then
      cp -rn /home/gitlab-runner/production/wwwroot/uploads/. /home/gitlab-runner/production-uploads/;
      fi
    - rm -rf /home/gitlab-runner/production/ || true
    - mkdir -p /home/gitlab-runner/production/
    - cp -r ./Grinder.Api/bin/Release/net10.0/linux-x64/publish/* /home/gitlab-runner/production/

    - rm -rf /home/gitlab-runner/production/wwwroot/uploads
    - mkdir -p /home/gitlab-runner/production/wwwroot
    - ln -s /home/gitlab-runner/production-uploads/ /home/gitlab-runner/production/wwwroot/uploads

    - cp runner-scripts/production.sh /home/gitlab-runner/production.sh
    - chmod u+x /home/gitlab-runner/production.sh
    - echo "export DB_HOST=${DB_HOST}" > /home/gitlab-runner/production/.env
    - echo "export DB_NAME=${PROD_DB_NAME}" >> /home/gitlab-runner/production/.env
    - echo "export DB_USER=${DB_USER}" >> /home/gitlab-runner/production/.env
    - echo "export DB_PASS=${DB_PASS}" >> /home/gitlab-runner/production/.env
    - echo "export EMAILSETTINGS__USERNAME=${EmailSettings__Username}" >> /home/gitlab-runner/production/.env
    - echo "export EMAILSETTINGS__PASSWORD=${EmailSettings__Password}" >> /home/gitlab-runner/production/.env
    - echo "export LIVEKIT_URL=${LIVEKIT_URL}" >> /home/gitlab-runner/production/.env
    - echo "export LIVEKIT_API_KEY=${LIVEKIT_API_KEY}" >> /home/gitlab-runner/production/.env 
    - echo "export LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}" >> /home/gitlab-runner/production/.env
    - sudo systemctl restart production

    # Build and deploy frontend
    - cd ./Grinder.App
    - npm ci
    - NODE_ENV=production npm run build
    - rm -rf /home/gitlab-runner/production-frontend/ || true
    - mkdir -p /home/gitlab-runner/production-frontend/
    - cp -r ./build/* /home/gitlab-runner/production-frontend/

    # Ensure the folder is owned by the group nginx belongs to
    - chgrp -R gitlab-runner /home/gitlab-runner/production-frontend/
    # Give the group Read and Execute permissions
    - chmod -R 750 /home/gitlab-runner/production-frontend/
  artifacts:
    paths:
      - Grinder.Api/bin/Release/net10.0/linux-x64/publish/
      - Grinder.App/build/
  only:
    - tags
